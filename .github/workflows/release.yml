name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo build --release
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $hash = (Get-FileHash target/release/skedaddle.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  skedaddle.exe" | Out-File -Encoding ascii skedaddle.exe.sha256
          gh release create $env:GITHUB_REF_NAME target/release/skedaddle.exe skedaddle.exe.sha256 --title "Skedaddle $env:GITHUB_REF_NAME" --generate-notes
